<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1210"/>
      <stop offset="50%" stop-color="#141d18"/>
      <stop offset="100%" stop-color="#0a0f0d"/>
    </linearGradient>
    <radialGradient id="scopeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fff8a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#39ff5a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#39ff5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39ff5a"/>
      <stop offset="100%" stop-color="#1aa83a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8ffe9"/>
      <stop offset="100%" stop-color="#9fffb0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- distant terrain silhouette -->
  <polygon points="0,280 120,230 220,265 340,210 460,255 600,220 760,260 900,225 1040,260 1200,235 1200,360 0,360" fill="#0e1712" opacity="0.8"/>
  <polygon points="0,310 150,285 300,300 470,275 650,300 820,280 1000,305 1200,285 1200,360 0,360" fill="#0a120e"/>

  <!-- faint grid lines for HUD feel -->
  <g stroke="#2b4a35" stroke-width="1" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- scope assembly right side -->
  <g transform="translate(945,150)">
    <circle r="150" fill="url(#scopeGlow)"/>
    <circle r="118" fill="none" stroke="#2c5c3a" stroke-width="3" opacity="0.7"/>
    <circle r="98" fill="none" stroke="#39ff5a" stroke-width="1.5" opacity="0.55"/>
    <circle r="60" fill="none" stroke="#39ff5a" stroke-width="1" opacity="0.4"/>

    <line x1="-140" y1="0" x2="-30" y2="0" stroke="url(#crossGrad)" stroke-width="4"/>
    <line x1="30" y1="0" x2="140" y2="0" stroke="url(#crossGrad)" stroke-width="4"/>
    <line x1="0" y1="-140" x2="0" y2="-30" stroke="url(#crossGrad)" stroke-width="4"/>
    <line x1="0" y1="30" x2="0" y2="140" stroke="url(#crossGrad)" stroke-width="4"/>

    <circle r="4.5" fill="#39ff5a"/>

    <!-- tick marks -->
    <g stroke="#39ff5a" stroke-width="2" opacity="0.7">
      <line x1="-98" y1="-6" x2="-98" y2="6"/>
      <line x1="98" y1="-6" x2="98" y2="6"/>
      <line x1="-6" y1="-98" x2="6" y2="-98"/>
      <line x1="-6" y1="98" x2="6" y2="98"/>
      <line x1="-70" y1="-70" x2="-60" y2="-60"/>
      <line x1="70" y1="70" x2="60" y2="60"/>
      <line x1="70" y1="-70" x2="60" y2="-60"/>
      <line x1="-70" y1="70" x2="-60" y2="60"/>
    </g>

    <!-- target lock corners -->
    <g stroke="#e8ffe9" stroke-width="2.5" opacity="0.85" fill="none">
      <polyline points="-160,-160 -160,-135 -135,-160"/>
      <polyline points="160,-160 160,-135 135,-160"/>
      <polyline points="-160,160 -160,135 -135,160"/>
      <polyline points="160,160 160,135 135,160"/>
    </g>
  </g>

  <!-- small distant target markers -->
  <g fill="none" stroke="#39ff5a" opacity="0.5">
    <circle cx="815" cy="95" r="10" stroke-width="1.5"/>
    <line x1="815" y1="85" x2="815" y2="105" stroke-width="1"/>
    <line x1="805" y1="95" x2="825" y2="95" stroke-width="1"/>
    <circle cx="1080" cy="270" r="8" stroke-width="1.5"/>
  </g>

  <!-- HUD corner brackets top-left of text zone -->
  <g stroke="#39ff5a" stroke-width="2" opacity="0.5" fill="none">
    <polyline points="60,60 60,80 80,80"/>
  </g>

  <!-- headline -->
  <text x="60" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="86" font-weight="700" fill="url(#titleGrad)" letter-spacing="1" textLength="620" lengthAdjust="spacingAndGlyphs">DayZ Aimbot</text>

  <!-- accent underline -->
  <rect x="62" y="188" width="330" height="4" fill="#39ff5a" opacity="0.8"/>

  <!-- tagline -->
  <text x="60" y="232" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#c8f5d0" opacity="0.9" textLength="740" lengthAdjust="spacingAndGlyphs">Handles target tracking for DayZ with minimal, no-frills</text>
  <text x="60" y="263" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#c8f5d0" opacity="0.9" textLength="180" lengthAdjust="spacingAndGlyphs">configuration</text>

  <!-- small status readout -->
  <text x="62" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#39ff5a" opacity="0.7" letter-spacing="2">LOCKED · MINIMAL CONFIG · FAST TRACKING</text>

  <rect x="0" y="0" width="1200" height="360" fill="url(#vignette)"/>
</svg>